{% extends "base.html" %}

{% block content %}
<section class="results-section" style="padding-top: 3rem;">
    <div class="container">
        <div class="results-header">
            <div class="results-header-info">
                <h2 class="results-title">
                    <i class="bi bi-clock-history me-2"></i>Scan History
                </h2>
                <p class="text-muted mt-1">View previous scan results</p>
            </div>
            <div class="results-header-actions">
                <a href="/" class="btn btn-outline-accent btn-sm">
                    <i class="bi bi-plus-circle me-1"></i> New Scan
                </a>
            </div>
        </div>
        <div class="detail-section">
            <div class="detail-panel">
                <div id="historyContent">
                    <p class="text-muted">
                        <i class="bi bi-info-circle me-1"></i>
                        Scan history with SQLite storage will be implemented in Phase 6.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
